
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>The Fallen Knight</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <header class="hud">
      <div class="brand">
        <span class="subtitle">A WHIMSICAL FANTASY</span>
        <h1>The Fallen Knight</h1>
      </div>
      <div class="stats">
        <span>COINS <b id="coins">0</b></span>
        <span>DIAMONDS <b id="diamonds">0</b></span>
        <span>HEALTH <b id="health">100</b></span>
      </div>
    </header>

    <section class="viewport">
      <canvas id="world"
        aria-label="The Fallen Knight fantasy adventure game">
      </canvas>
      <div id="notice">The forest is waiting for you...</div>
      <div id="level">FOREST OF WHISPERS · LEVEL 1</div>
    </section>

    <nav class="controls" aria-label="Game controls">
      <button id="left" aria-label="Move left">◀</button>
      <button id="right" aria-label="Move right">▶</button>
      <button id="jump">JUMP</button>
      <button id="attack">ATTACK</button>
    </nav>

    <p class="help">
      Move · Jump · Fight · Collect treasures · Discover new worlds
    </p>
  </main>
  <script src="script.js"></script>
</body>
</html>
